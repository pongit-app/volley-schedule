(function(){
  const root=document.documentElement, btn=document.getElementById('theme'),
        meta=document.querySelector('meta[name="theme-color"]');
  let saved=null; try{saved=localStorage.getItem('theme');}catch(e){}
  function apply(t){
    if(t==='dark') root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme');
    btn.textContent = t==='dark' ? '☀️' : '🌙';
    if(meta) meta.setAttribute('content', t==='dark' ? '#0e1116' : '#f5f3f6');
  }
  apply(saved==='dark'?'dark':'light');
  btn.onclick=function(){
    const next = root.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
    apply(next); try{localStorage.setItem('theme',next);}catch(e){}
  };
})();
const GOKEY='going';
let GOING;
try{ const raw=localStorage.getItem(GOKEY); GOING=new Set(raw?JSON.parse(raw):null); }catch(e){ GOING=new Set(); }
function saveGoing(){ try{ localStorage.setItem(GOKEY, JSON.stringify([...GOING])); }catch(e){} }
function gkey(g){ return cur+'|'+g.d+'|'+g.opp; }

const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const keys = Object.keys(DATA);
let cur = keys[0], filt = "all";
const tabsEl = document.getElementById('tabs');
const isNT = () => DATA[cur].type==='nt';

function mkTabs(){
  tabsEl.innerHTML = '';
  keys.forEach(k=>{
    const b=document.createElement('span');
    b.className='tab'+(k===cur?' on':'');
    b.textContent = (DATA[k].type==='nt'?'🇯🇵 ':'') + DATA[k].short;
    b.style.setProperty('--tc', DATA[k].color);
    b.onclick=()=>{cur=k;mkTabs();render();};
    tabsEl.appendChild(b);
  });
}
document.querySelectorAll('#filters .chip').forEach(c=>{
  c.onclick=()=>{
    document.querySelectorAll('#filters .chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); filt=c.dataset.f; render();
  };
});
const dObj = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const monLabel = s => { const [y,m]=s.split('-'); return y+"年"+Number(m)+"月"; };
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const haLabel = (ha,nt) => nt ? (ha==='HOME'?'国内':'海外') : (ha==='HOME'?'H':'A');

function row(g){
  const nt=isNT();
  const dt = dObj(g.d), past = dt < TODAY;
  const diff = Math.round((dt-TODAY)/86400000);
  const wc = g.w==='土'?' sat':(g.w==='日'?' sun':'');
  const going = GOING.has(gkey(g));
  const cls = 'g'+(past?' past':'')+(!past&&diff<=7?' soon':'')+(nt?' jp':'')+(g.k==='pre'?' pregame':'')+(going?' going':'');
  const [,mm,dd] = g.d.split('-');
  return `<div class="${cls}">
    <div class="dt${wc}"><b>${Number(mm)}/${Number(dd)}</b><i>${g.w}</i></div>
    <div class="mid">
      ${g.k==='pre'?`<div class="pre">プレシーズンマッチ</div>`:''}
      ${g.cat?(nt?`<div class="cat">${esc(g.cat)}</div>`:`<div class="sec">${esc(g.cat)}</div>`):''}
      <div class="op">vs ${esc(g.opp)}</div>
      <div class="vn">${esc(g.venue)}</div>
      ${g.ss?`<div class="ss">${esc(g.ss)}</div>`:''}
      ${nt&&g.tv&&!g.sc?`<div class="tv">📺 ${esc(g.tv)}</div>`:''}
      ${g.note?`<div class="nt">${esc(g.note)}</div>`:''}
    </div>
    <div class="rt">
      <span class="ha ${g.ha==='HOME'?'H':'A'}">${haLabel(g.ha,nt)}</span>
      ${g.sc
        ? `<div class="sc ${g.r}">${g.r==='W'?'○':'●'} ${esc(g.sc)}</div>`
        : `<div class="tm">${esc(g.t)&&g.t!=='未定'?esc(g.t):'時刻未定'}</div>`}
    </div>
    <button class="go${going?' on':''}" type="button" data-k="${esc(gkey(g))}"
      aria-pressed="${going}" aria-label="行く試合にする">${going?'★':'☆'}</button>
    </div>`;
}

function render(){
  const nt=isNT(), club=DATA[cur];
  document.getElementById('chipH').textContent = nt?'国内':'ホーム';
  document.getElementById('chipA').textContent = nt?'海外':'アウェー';
  document.getElementById('chipP').style.display = club.games.some(g=>g.k==='pre')?'':'none';
  if(filt==='pre' && !club.games.some(g=>g.k==='pre')) filt='all';
  let games = club.games.slice();
  if(filt==='HOME'||filt==='AWAY') games = games.filter(g=>g.ha===filt);
  if(filt==='future') games = games.filter(g=>dObj(g.d)>=TODAY);
  if(filt==='pre') games = games.filter(g=>g.k==='pre');
  if(filt==='going') games = games.filter(g=>GOING.has(gkey(g)));
  document.getElementById('count').textContent = games.length+"試合";

  const upcoming = club.games.filter(g=>dObj(g.d)>=TODAY && !g.sc)[0];
  let html = '';
  if(upcoming){
    const days = Math.round((dObj(upcoming.d)-TODAY)/86400000);
    const when = days===0?'今日':days===1?'明日':`あと${days}日`;
    const who = nt ? cur : club.short;
    const tm = upcoming.t&&upcoming.t!=='未定'?upcoming.t:'時刻未定';
    html += `<div class="next"><div class="lb">NEXT GAME ・ ${when}</div>
      <div class="mn">${upcoming.d.replace(/-/g,'/')}（${upcoming.w}） ${esc(who)} vs ${esc(upcoming.opp)}</div>
      <div class="sb">${nt?esc(upcoming.cat)+' ・ ':(upcoming.ha==='HOME'?'ホーム ・ ':'アウェー ・ ')}${esc(upcoming.venue)} ・ ${esc(tm)}</div></div>`;
  }
  const rec=(list,label)=>{ const done=list.filter(g=>g.sc); if(!done.length) return '';
    const w=done.filter(g=>g.r==='W').length; return `<span class="lb">${label}</span> <b>${w}勝${done.length-w}敗</b>`; };
  const parts = nt ? [rec(club.games,'2026年 代表戦')]
    : [rec(club.games.filter(g=>g.k==='pre'),'プレシーズン'), rec(club.games.filter(g=>g.k!=='pre'),'リーグ戦')];
  const recHtml = parts.filter(Boolean).join(' &nbsp;/&nbsp; ');
  if(recHtml) html += `<div class="rec">${recHtml}</div>`;
  let lastM='';
  games.forEach(g=>{
    const m=g.d.slice(0,7);
    if(m!==lastM){ html += `<div class="mon">${monLabel(m)}</div>`; lastM=m; }
    html += row(g);
  });
  html += `<div class="note">
    <b>視聴メモ</b><br>
    ・SVリーグ（東京GB）→ <b>J SPORTSオンデマンド</b>で男女全試合ライブ配信（2026-27〜）<br>
    ・アジア競技大会（愛知・名古屋）→ <b>TBS系</b>が国内放送、U-NEXTでもライブ配信<br><br>
